<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin do AgrisLab</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wdth,wght@0,18..144,87..112,300..900;1,18..144,87..112,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- header do admin -->
    <header>
        <div class="headerTop">
            <img class="imageLogo" src="../Paginas/HeaderFooter/imagens/logo.png" alt="">
            <h1 class="h1HEADER">Painel Administrativo</h1>
        </div>
    </header>

    <!-- menu lateral -->
    <div class="sidebar">
        <span>Páginas:</span>
        <a class="admin-atual" href="#pagina-inicial">Pág. Inicial</a>
        <a class="admin-selecionavel" href="#publicacoes">Publicações</a>
        <a class="admin-selecionavel" href="#noticias">Notícias</a>
        <a class="admin-selecionavel" href="#membros">Membros</a>
        <a class="admin-selecionavel" href="#projetos">Projetos</a>
        <a class="admin-selecionavel" href="#sobre">Sobre</a>
        <a class="admin-selecionavel" href="#vagas">Vagas</a>
    </div>

    <div class="main">

        <main>
            <h2 class="admin-h2">Página Inicial</h2>

            <!-- conteúdo do site após o titulo da página atual -->
            <div class="admin-conteudo">

                <form action="/upload" method="post" enctype="multipart/form-data">
                    <label for="imageUpload">Envie uma imagem:</label><br><br>
                    <input type="file" id="imageUpload" name="image" accept="image/*" required>
                    <br><br>
                    <button type="submit">Enviar</button>
                </form>
            </div>

        </main>

    </div>

    <div class="admin-footer-wrapper">
        <footer class="admin-footer">
            <span>2025 AgrisLab | Suporte</span>
        </footer>
    </div>

</body>
